services:
  web:
    build:
      context: ./sewpg-bid-frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_ENV: production
        VITE_API_BASE_URL: /api
        VITE_ONLYOFFICE_DOCUMENT_SERVER_URL: /ds
        VITE_ONLYOFFICE_HEALTHCHECK_PATH: /healthcheck
    container_name: sewpg_bid_web
    depends_on:
      fastapi:
        condition: service_healthy
      onlyoffice:
        condition: service_started
    ports:
      - "${WEB_PORT:-80}:80"
    restart: unless-stopped

  fastapi:
    build:
      context: ./sewpg-bid-backend
    container_name: sewpg_bid_fastapi
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://biduser:bidpass@postgres:5432/bidplatform}
      SQLITE_PATH: /data/sqlite/app.db
      UPLOADS_DIR: /data/uploads
      DOCUMENTS_DIR: /data/documents
      PARSED_DIR: /data/parsed
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-http://opencode:4096}
      OPENCODE_PROVIDER_ID: ${OPENCODE_PROVIDER_ID:-opencode}
      OPENCODE_MODEL_ID: ${OPENCODE_MODEL_ID:-big-pickle}
      OPENCODE_TIMEOUT_SEC: ${OPENCODE_TIMEOUT_SEC:-60}
      MAX_UPLOAD_FILE_SIZE_BYTES: ${MAX_UPLOAD_FILE_SIZE_BYTES:-1073741824}
      ALLOWED_UPLOAD_EXTENSIONS: ${ALLOWED_UPLOAD_EXTENSIONS:-.pdf,.docx}
      ONLYOFFICE_INTERNAL_URL: ${ONLYOFFICE_INTERNAL_URL:-http://onlyoffice}
      ONLYOFFICE_BACKEND_BASE_URL: ${ONLYOFFICE_BACKEND_BASE_URL:-http://fastapi:8000}
      ONLYOFFICE_CALLBACK_TOKEN: ${ONLYOFFICE_CALLBACK_TOKEN:-}
      ONLYOFFICE_CALLBACK_ALLOWED_HOSTS: ${ONLYOFFICE_CALLBACK_ALLOWED_HOSTS:-onlyoffice,127.0.0.1,localhost}
      ONLYOFFICE_DOWNLOAD_ALLOWED_HOSTS: ${ONLYOFFICE_DOWNLOAD_ALLOWED_HOSTS:-onlyoffice,127.0.0.1,localhost}
      ONLYOFFICE_DOWNLOAD_MAX_BYTES: ${ONLYOFFICE_DOWNLOAD_MAX_BYTES:-1073741824}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_MATERIALS: ${MINIO_BUCKET_MATERIALS:-bid-materials}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-bid-documents}
      MINIO_BUCKET_TEMPLATES: ${MINIO_BUCKET_TEMPLATES:-bid-templates}
    expose:
      - "8000"
    depends_on:
      onlyoffice:
        condition: service_started
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - sqlite_data:/data/sqlite
      - uploads:/data/uploads
      - documents:/data/documents
      - parsed:/data/parsed
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  opencode:
    image: node:22-bookworm
    container_name: sewpg_bid_opencode
    working_dir: /workspace
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    command: >
      sh -lc "mkdir -p /root/.local/share/opencode &&
      if [ -f /bootstrap/opencode-host/auth.json ]; then cp /bootstrap/opencode-host/auth.json /root/.local/share/opencode/auth.json; fi &&
      npm install -g opencode-ai@${OPENCODE_NPM_VERSION:-1.14.18} &&
      opencode serve --hostname 0.0.0.0 --port 4096 --cors http://localhost --cors http://127.0.0.1"
    expose:
      - "4096"
    ports:
      - "${OPENCODE_HOST_PORT:-4096}:4096"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4096/global/health').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ./sewpg-bid-backend/opencode:/workspace
      - ${OPENCODE_AUTH_HOST_DIR:-./opencode-auth}:/bootstrap/opencode-host:ro
      - opencode_data:/root/.local/share/opencode
      - opencode_cache:/root/.cache/opencode
    restart: unless-stopped

  onlyoffice:
    image: ${ONLYOFFICE_IMAGE:-onlyoffice/documentserver:9.3.1.2}
    platform: ${ONLYOFFICE_PLATFORM:-linux/amd64}
    container_name: sewpg_bid_onlyoffice
    environment:
      JWT_ENABLED: "${ONLYOFFICE_JWT_ENABLED:-false}"
      JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:-}"
      JWT_HEADER: "${ONLYOFFICE_JWT_HEADER:-Authorization}"
      JWT_IN_BODY: "${ONLYOFFICE_JWT_IN_BODY:-false}"
      ALLOW_PRIVATE_IP_ADDRESS: "${ONLYOFFICE_ALLOW_PRIVATE_IP_ADDRESS:-true}"
    expose:
      - "80"
    volumes:
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sewpg_bid_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bidpass}
      POSTGRES_DB: ${POSTGRES_DB:-bidplatform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biduser} -d ${POSTGRES_DB:-bidplatform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: sewpg_bid_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sqlite_data:
  uploads:
  documents:
  parsed:
  opencode_data:
  opencode_cache:
  onlyoffice_logs:
  onlyoffice_data:
  onlyoffice_lib:
  onlyoffice_db:
  postgres_data:
  minio_data:
