<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="strong">
    <family>宋体</family>
    <prefer>
      <family>Songti SC</family>
      <family>STSong</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>SimSun</family>
    <prefer>
      <family>Songti SC</family>
      <family>STSong</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>NSimSun</family>
    <prefer>
      <family>Songti SC</family>
      <family>STSong</family>
    </prefer>
  </alias>
</fontconfig>
