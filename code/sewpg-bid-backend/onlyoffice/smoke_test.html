<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OnlyOffice Smoke Test</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f5f7fa;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: #1f2937;
      color: #fff;
      font-size: 14px;
    }

    .toolbar-title {
      font-weight: 600;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .download-btn {
      border: 0;
      border-radius: 6px;
      padding: 8px 14px;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    .download-btn:hover {
      background: #1d4ed8;
    }

    #placeholder {
      flex: 1;
      min-height: calc(100vh - 56px);
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-title">OnlyOffice 本地联调页</div>
    <div class="toolbar-actions">
      <button id="downloadBtn" class="download-btn" type="button">下载 Word</button>
    </div>
  </div>
  <div id="placeholder"></div>

  <script>
    const DOCUMENT_SERVER_URL = "http://127.0.0.1:8080";
    const API_BASE_URL = "http://127.0.0.1:8000";
    const DOC_ID = "sample";

    function loadOnlyOfficeScript() {
      return new Promise((resolve, reject) => {
        const existing = document.querySelector('script[data-onlyoffice-api="true"]');
        if (existing) {
          existing.addEventListener("load", resolve, { once: true });
          existing.addEventListener("error", () => reject(new Error("OnlyOffice 脚本加载失败")), { once: true });
          return;
        }

        const script = document.createElement("script");
        script.src = `${DOCUMENT_SERVER_URL}/web-apps/apps/api/documents/api.js`;
        script.async = true;
        script.dataset.onlyofficeApi = "true";
        script.onload = resolve;
        script.onerror = () => reject(new Error("OnlyOffice 脚本加载失败"));
        document.head.appendChild(script);
      });
    }

    function downloadDocument() {
      window.open(`${API_BASE_URL}/api/documents/${DOC_ID}/download`, "_blank");
    }

    async function bootEditor() {
      try {
        await loadOnlyOfficeScript();

        const response = await fetch(`${API_BASE_URL}/api/documents/${DOC_ID}/config`);
        if (!response.ok) {
          throw new Error(`获取配置失败: ${response.status}`);
        }

        const config = await response.json();
        window.docEditor = new DocsAPI.DocEditor("placeholder", config);
      } catch (error) {
        console.error(error);
        document.getElementById("placeholder").innerHTML = `
          <div style="padding: 24px; color: #b91c1c;">
            编辑器初始化失败：${error.message}
          </div>
        `;
      }
    }

    document.getElementById("downloadBtn").addEventListener("click", downloadDocument);
    window.addEventListener("load", bootEditor);
  </script>
</body>
</html>
