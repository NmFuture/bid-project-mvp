services:
  docling-worker:
    image: ${DOCLING_IMAGE:-sewpg-bid/docling-worker:5090-latest}
    build:
      dockerfile: Dockerfile.docling-worker.cuda
      args:
        PYTORCH_CUDA_INDEX_URL: ${PYTORCH_CUDA_INDEX_URL:-https://download.pytorch.org/whl/cu130}
        HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    environment:
      DOCLING_DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: "0"
      CUDA_VISIBLE_DEVICES: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  ocr:
    environment:
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      NVIDIA_VISIBLE_DEVICES: "0"
      CUDA_VISIBLE_DEVICES: "0"

  # OpencodeClient 的并发闸是进程内信号量，fastapi / worker / material-worker
  # 各持有一份。开发测试阶段保留 .env 覆盖能力，不写死取值。
  fastapi:
    environment:
      OPENCODE_MAX_CONCURRENCY: ${OPENCODE_MAX_CONCURRENCY:-8}

  worker:
    environment:
      OPENCODE_MAX_CONCURRENCY: ${OPENCODE_MAX_CONCURRENCY:-8}

  material-worker:
    environment:
      OPENCODE_MAX_CONCURRENCY: ${OPENCODE_MAX_CONCURRENCY:-8}
