name: MVP Quality Gate

on:
  push:
    paths:
      - "code/sewpg-bid-frontend/**"
      - "code/sewpg-bid-backend/**"
      - "code/docker-compose.yml"
      - ".github/workflows/mvp-quality.yml"
  pull_request:
    paths:
      - "code/sewpg-bid-frontend/**"
      - "code/sewpg-bid-backend/**"
      - "code/docker-compose.yml"
      - ".github/workflows/mvp-quality.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/sewpg-bid-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/sewpg-bid-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/sewpg-bid-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/sewpg-bid-backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall app

      - name: Import FastAPI app
        run: python -c "from app.main import app; print(app.title)"
