name: MVP Quality Gate

on:
  push:
    paths:
      - "README.md"
      - "doc/**"
      - "code/sewpg-bid-frontend/**"
      - "code/sewpg-bid-backend/**"
      - "code/docker-compose*.yml"
      - "code/.env*.example"
      - "code/OCR_DEPLOY.md"
      - "code/scripts/**"
      - ".github/workflows/mvp-quality.yml"
  pull_request:
    paths:
      - "README.md"
      - "doc/**"
      - "code/sewpg-bid-frontend/**"
      - "code/sewpg-bid-backend/**"
      - "code/docker-compose*.yml"
      - "code/.env*.example"
      - "code/OCR_DEPLOY.md"
      - "code/scripts/**"
      - ".github/workflows/mvp-quality.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/sewpg-bid-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/sewpg-bid-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: biduser
          POSTGRES_PASSWORD: bidpass
          POSTGRES_DB: bidplatform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biduser -d bidplatform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: code/sewpg-bid-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/sewpg-bid-backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest

      - name: Initialize backend database
        working-directory: code
        run: |
          python - <<'PY'
          from pathlib import Path
          import psycopg

          sql = Path("initdb/01-init.sql").read_text(encoding="utf-8")
          with psycopg.connect("postgresql://biduser:bidpass@localhost:5432/bidplatform", autocommit=True) as connection:
              connection.execute(sql)
          PY
        env:
          PGCONNECT_TIMEOUT: "10"

      - name: Compile backend
        run: python -m compileall app

      - name: Import FastAPI app
        run: python -c "from app.main import app; print(app.title)"
        env:
          APP_STORE_BACKEND: memory
          DATABASE_URL: postgresql+asyncpg://biduser:bidpass@localhost:5432/bidplatform

      - name: Validate 5090 Compose overlay
        working-directory: code
        run: >-
          docker compose --env-file .env.example
          -f docker-compose.yml
          -f docker-compose.ocr.yml
          -f docker-compose.5090.yml
          config --quiet

      - name: Run backend tests
        run: python -m pytest -m "not integration"
        env:
          APP_STORE_BACKEND: memory
          DATABASE_URL: postgresql+asyncpg://biduser:bidpass@localhost:5432/bidplatform

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/sewpg-bid-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/sewpg-bid-backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest

      - name: Start PostgreSQL, MinIO, Redis, and OpenCode
        working-directory: code
        run: docker compose up -d --wait postgres minio redis opencode

      - name: Run integration tests
        run: python -m pytest -m integration
        env:
          BID_RUN_INTEGRATION: "1"
          APP_STORE_BACKEND: postgres
          DATABASE_URL: postgresql+asyncpg://biduser:bidpass@localhost:5432/bidplatform
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          REDIS_URL: redis://localhost:6379/0

      - name: Stop integration services
        if: always()
        working-directory: code
        run: docker compose down -v
